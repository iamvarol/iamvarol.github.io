# Resume — the second of the two load-bearing data files (the other is src/lib/site.ts).
#
# Single source for both consumers: the /resume page (Phase 6) and the Typst PDF
# the deploy workflow compiles from it. Edit here, never in a component.
#
# Conventions:
#   - `start` / `end` are 'YYYY-MM' strings; `end: null` means present. Quoted so
#     YAML can't reinterpret them, and month-precision so the page can format the
#     display range instead of storing a second, driftable copy of it.
#   - `highlights` are the bullets, in the order they should render.
#   - `stack` is optional and only present where the role has a named stack.
#   - `blurb` is the one-sentence version of `highlights`, for the landing-page
#     career timeline. Required — a role that can't be said in a sentence can't
#     go on a card, and the schema is where you should find that out.
#   - `short` is the rail label, only where the company name is too long for a
#     timeline stop. Falls back to `company`.
#     Both are ignored by resume.typ, which reads fields by name, so neither
#     reaches the PDF.
#   - `date` on `publications` / `writing` is 'YYYY', 'YYYY-MM' or 'YYYY-MM-DD',
#     quoted like the others. Precision is per entry — use the finest one you
#     can actually source; both renderers format whatever they're given.
#   - No URL is guessed. A missing `url` means it hasn't been supplied yet.

