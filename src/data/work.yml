# Selected work — the case studies.
#
# Each entry is a skeleton lifted from src/data/resume.yml: the company, the
# figures and the stack are facts already on the resume; the prose fields are
# yours. Every field that begins with `TODO(emre):` describes what belongs there
# and is a placeholder, not copy. While any marker remains in an entry, that
# entry has no route, no nav link and no sitemap line in production; `npm run
# dev` shows it with a Draft badge so the layout can be checked. Removing the
# last marker publishes it — nothing else to flip.
#
# Fields
#   id        URL slug: /work/<id>/
#   company   must equal an experience[].company in resume.yml — the role,
#             dates and card line are read from there, never repeated here
#   sector    the client's world, for the eyebrow (company · sector)
#   summary   optional one-liner for cards; falls back to the role's `blurb`
#   metrics   value must appear verbatim in that role's highlights (checked at build)
#   period    optional 'YYYY-MM' start/end override when the case spans less
#             than the role; end: null means ongoing
#   links     internal ('/blog/…') or absolute URLs
#   order     display order, 1 first

