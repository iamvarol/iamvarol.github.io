- id: photo
  question: Headshot on the About page, or text only?
  note: >-
    Text only is more consistent with the restraint direction. A photo helps a
    recruiter connect a name to a face, and you already have one in the archive
    at `git show hugo-archive:assets/images/author/aliemrevarol.png`.
  default: text only
