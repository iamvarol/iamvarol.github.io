- id: analytics
  question: Do you want to know whether recruiters are reading the site?
  note: >-
    GoatCounter or Plausible is roughly 1 KB, needs no cookie banner, and would
    be the only third-party request on the site. Skipping it keeps the page at
    zero external requests.
  default: none
  answer: 'TODO(emre)'

- id: custom-domain
  question: Is a custom domain imminent?
  note: >-
    It does not change the build — `site` in astro.config.mjs plus a
    public/CNAME. But if it is close, setting it now avoids a period where
    search engines index the github.io URL and then have to be redirected.
  default: stay on iamvarol.github.io
  answer: 'TODO(emre)'

- id: theme-default
  question: Should the site force dark, or keep following the visitor's OS setting?
  note: >-
    You asked for both "dark as the default" and "respect prefers-color-scheme",
    which conflict in practice: browsers report `light` when the visitor has
    expressed no preference, so most recruiters on a default phone currently see
    the light theme and never the dark design. Forcing dark on first visit is a
    one-line change in BaseHead.astro; the toggle keeps working either way.
  default: follow the OS, as originally specified
  answer: 'TODO(emre)'

- id: pdf-typeface
  question: Should the resume PDF match the site's typeface?
  note: >-
    The PDF is currently Libertinus Serif because Typst embeds only four fonts
    and using a system font would make output depend on the build machine.
    Matching Inter means committing two TTF files (~700 KB) to the repo. The
    serif arguably suits a CV with three peer-reviewed publications.
  default: keep Libertinus Serif
  answer: 'TODO(emre)'

