# Landing page copy.
#
# Derived from src/data/resume.yml — every claim below traces to a bullet there.
# `proof[]` is held to that literally (see getLanding() in src/lib/resume.ts);
# `focus[]` says the same things at a different length for a different reader,
# so if a number changes in the resume, change it here too.

hero:
  # His positioning statement, verbatim (2026-09-23). The headline above it is
  # `site.tagline`; the axes line below it is `basics.focus` in resume.yml.
  # An earlier draft of this sentence is in git history (commit before Phase 9).
  statement: >-
    I build AI and data systems close to real customer problems — from customer data and implementation to production analytics and reusable engineering capabilities.
    My work spans retail supply chain, forecasting, data quality, and applied AI, from messy customer data to production systems and reusable engineering capabilities.

  cta:
    label: Read the resume
    href: '/resume/'

  secondary:
    label: Download the PDF
    href: '/emre-varol-resume.pdf'

  # The availability line — the first thing a recruiter looks for and the one
  # thing on this page only you can say. Hidden from production while the
  # marker remains; visible in `npm run dev` so the layout can be checked.
  # Facts, one line: the level you are open to · remote / hybrid posture · from
  # when. Leave the whole block out to publish without one.
  status:
    text: 'Open to Senior / Lead roles in AI, data science and forward-deployed engineering · UK / NL / US / CA / Istanbul / remote'
    href: '/contact/'

# The proof strip. Three or four figures a hiring manager can carry into a
# debrief, each quoted verbatim from a resume.yml bullet (`source` names the
# company). Values, not sentences; the label is the neutral caption.
proof:
  - value: '90–95%'
    label: less manual human-in-the-loop work in onboarding
    source: invent.ai
  - value: '20,000+'
    label: personnel on one decision-support platform
    source: Turkish Government — Defense Sector
  - value: '17%'
    label: inventory cost cut, availability held
    source: Turkish Government — Defense Sector
  - value: '45%'
    label: faster query resolution with an internal AI assistant
    source: Berlin Tires

# The numbered sequence — the 01 / 02 / 03 element from the reference design.
# Current work first, since the first item renders as the active one; the defense
# years come last because they are the differentiator, not the headline.
#
# `basics.focus` in resume.yml is the five-word version — the hero's key line,
# the PDF and the OG card. This list is the longer read: titles and details are
# Emre's own (2026-09-23).
focus:
  - title: Retail Supply Chain AI
    detail: >-
      Demand forecasting, replenishment, assortment and price optimization for
      enterprise retailers — working from raw customer data through implementation,
      production analytics and validation.

  - title: Forward-Deployed AI
    detail: >-
      I work close to customer data and implementation, building the validation,
      analytics and feedback loops that help project teams move from raw data to
      production capabilities faster.

  - title: Pulse
    detail: >-
      A reusable retail delivery platform I built at invent.ai that reduces roughly
      90–95% of manual human-in-the-loop onboarding work and runs advanced analyses
      overnight, then continues supporting teams as forecasting and replenishment go live.

  - title: NLP & Knowledge Graphs
    detail: >-
      Review mining, clinical language models and Neo4j knowledge graphs — a
      medical Q&A system for US healthcare clients, and the voice-of-customer
      engine behind a beauty-analytics product.

  - title: Decision Support & Operations Research
    detail: >-
      Fourteen years in the defense sector building simulation and decision-support
      systems, including an enterprise platform serving 20,000+ personnel and an
      inventory redesign that cut costs 17%.
