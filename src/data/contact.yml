# Contact page copy.
#
# `intro` is the sentence that was on the page before this file existed, moved
# here unchanged so content lives in data. The two fields carrying the marker are
# yours: each is hidden on its own until its marker is replaced (the page
# itself stays live), and `include` disappears while any item is pending.
# Languages are not here — they come from resume.yml when you add them there.

intro: >-
  Based in Istanbul, Türkiye, working with teams across Europe and the US. Email is the
  surest way to reach me; I read everything.

# One clause: how quickly you usually reply.
responseTime: 'I usually reply within two working days.'

# What makes an approach easy to answer. Up to five short items.
include:
  - 'The role, level and location or remote setup'
  - 'The company, team and where you are in the hiring process'
  - 'Anything specific you would like me to prepare before a conversation'
