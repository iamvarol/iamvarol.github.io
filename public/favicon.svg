<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The forecast-band mark: actuals, a today line, and the widening P10–P90
       band — the same motif as the landing hero and the share cards, cut down
       to a tile. Reads on both tab-bar themes via the embedded media query. -->
  <style>
    .tile { fill: #0a0a0b; }
    .hist { stroke: #ededed; }
    .today { stroke: #8b8b93; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #ffffff; }
      .hist { stroke: #17171a; }
      .today { stroke: #6b6b74; }
      .fcst { stroke: #6d28d9; }
      .band { fill: #6d28d9; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <path class="band" fill="#a78bfa" fill-opacity="0.28" d="M19 15.5 L22 13.8 L25 12.4 L27.5 11.2 L27.5 20.2 L25 18.8 L22 17.6 L19 15.5 Z" />
  <path class="hist" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5 L7.5 17 L10 18.6 L13 14.8 L16 16.2 L19 15.5" />
  <path class="fcst" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19 15.5 L22 15.7 L25 15.6 L27.5 15.7" />
  <path class="today" fill="none" stroke-width="1" d="M19 8 V24" />
</svg>
